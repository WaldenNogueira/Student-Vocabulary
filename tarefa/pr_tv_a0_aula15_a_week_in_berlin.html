<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="tp/icon-192.png">
<link rel="apple-touch-icon" href="tp/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Travel Passport">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>A0 Lesson 15 — Homework · Teacher Walden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
/* Layout: app de celular (coluna de 520px) sobre a foto do lago; a rota da aula é uma trilha pontilhada branca
   com 5 paradas e um avião que voa até a próxima. Telas de atividade: a mesma foto, escurecida, com vidro. */
:root{
  --night:#0B2B2C; --pine:#12403C; --lake:#22B8B2; --lake-d:#0F7F7A; --lake-l:#7FE3DC;
  --glow:#FFD9AE; --blush:#F7BFCB; --snow:#FFFFFF; --ink:#F2FBFA; --muted:#B7D8D4;
  --glass:rgba(255,255,255,.13); --glass2:rgba(255,255,255,.22); --edge:rgba(255,255,255,.34);
  --good:#41E2B0; --good-d:#1FA984; --bad:#FF7E6E; --bad-d:#D9584A; --sun:#FFC85A; --sun-d:#E0A23A;
  --paper:#FBF7EE; --paper-ink:#25221C;
  --f:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-news:"Libre Baskerville",Georgia,serif; --f-mast:"UnifrakturMaguntia","Libre Baskerville",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:400;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img,video{-webkit-user-drag:none;user-drag:none}
@media print{body{display:none}}
button{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;background:var(--night) url("img/fundo.jpg") center top/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;transition:background .6s;
  background:linear-gradient(180deg,rgba(11,43,44,.05) 0%,rgba(11,43,44,.18) 30%,rgba(11,43,44,.72) 62%,rgba(11,43,44,.94) 100%)}
/* ao descer até a trilha a foto escurece, para o texto branco ler bem sobre o céu claro */
.bg::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(9,36,37,.58);opacity:0;transition:opacity .5s}
body.desceu:not(.act) .bg::before{opacity:1}
body.act .bg{filter:blur(14px);transform:scale(1.08)}
body.act .bg::after{background:rgba(9,36,37,.80)}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 56px}
body.act .app{padding-bottom:230px}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0}
:focus-visible{outline:3px solid var(--lake-l);outline-offset:3px;border-radius:12px}

/* topo: logo Business English */
.top{display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.marca{display:grid;gap:5px;color:#fff;filter:drop-shadow(0 1px 8px rgba(0,0,0,.25))}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:36px;height:36px;flex:0 0 auto}
.logo span{display:grid;line-height:1}
.logo b{font-weight:600;font-size:26px;letter-spacing:-.01em}
.logo i{font-style:normal;font-weight:400;font-size:10.5px;letter-spacing:.62em;margin-top:4px;opacity:.88}
.by{font-size:11.5px;font-weight:300;font-style:italic;letter-spacing:.06em;opacity:.8;padding-left:46px}
.stats{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:17px;height:17px}

/* hero sobre a foto */
.hero{padding:20vh 0 4px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.28)}
.hi{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:0;margin:0 0 8px;color:#fff;font-weight:400;font-size:17px;cursor:pointer;text-shadow:inherit}
.hi svg{width:14px;height:14px;opacity:.7}
.hero .deco{width:230px;height:70px;display:block;margin-bottom:10px}
.hero .eyebrow{font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.hero h1{font-weight:300;font-size:46px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.01em}
.hero p{margin:0;font-size:19px;font-weight:300;opacity:.95}
.shelf{display:flex;gap:8px;overflow-x:auto;padding:20px 0 4px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;color:#fff;cursor:pointer}
.tab.on{background:#fff;color:var(--pine)}
.tab.lock{border-style:dashed;opacity:.8;cursor:default}
.story{margin-top:18px;padding:10px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.story img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:rgba(255,255,255,.08)}
.story div{padding:12px 8px 4px}
.story b{display:block;font-weight:500;font-size:18px;margin-bottom:3px}
.story span{font-size:15px;color:var(--muted);font-weight:300}
/* My list: as notas da aula (vem do Enviar do professor) */
.lista{margin-top:14px;padding:16px 16px 10px;border-radius:24px;background:rgba(255,255,255,.94);color:var(--pine);box-shadow:0 14px 30px -18px rgba(0,0,0,.5)}
.lista h3{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;margin:0 0 8px}
.lista h3 svg{width:20px;height:20px;color:var(--lake-d)}
.lista h3 small{margin-left:auto;font-weight:400;font-size:12px;color:#5E7D79}
.lista ul{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #E3EEEC;font-size:15.5px;line-height:1.35}
.lista li:first-child{border-top:0}
.lista li button{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;background:#E5F6F4;color:var(--lake-d);display:grid;place-items:center;cursor:pointer}
.lista li button svg{width:16px;height:16px}
/* instalar o app */
.inst{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,24,25,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .25s}
.inst .folha{width:100%;max-width:520px;background:#fff;color:var(--pine);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sobe .35s cubic-bezier(.2,.9,.3,1)}
.inst .ic{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:block;margin-bottom:12px}
.inst h2{font-weight:600;font-size:23px;margin:0 0 6px}
.inst p{margin:0 0 14px;color:#41615D;line-height:1.45}
.inst ol{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:10px}
.inst li{display:flex;align-items:center;gap:12px;background:#F1F8F7;border-radius:14px;padding:11px 12px;font-size:15.5px;line-height:1.35}
.inst li b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--lake-d);color:#fff;display:grid;place-items:center;font-size:13px}
.inst li svg{width:20px;height:20px;vertical-align:-4px;color:#1E6FD9}
.inst .btn{box-shadow:0 5px 0 var(--lake-d)}
.inst .depois{display:block;margin:14px auto 0;border:0;background:none;color:#5E7D79;font-size:14px;text-decoration:underline;cursor:pointer}
@keyframes fadein{from{opacity:0}}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}}
.pill.instala{cursor:pointer;background:#fff;color:var(--pine);border-color:#fff}
/* transicoes: cada tela entra suave; trocar de aula tem o aviao */
#app.in > *{animation:tin .38s cubic-bezier(.2,.8,.3,1) both}
#app.in > *:nth-child(2){animation-delay:.04s}#app.in > *:nth-child(3){animation-delay:.08s}#app.in > *:nth-child(4){animation-delay:.12s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.voo{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--night);color:#fff;animation:fadein .25s}
.voo div{text-align:center;font-weight:300;font-size:20px}
.voo svg{width:46px;height:46px;display:block;margin:0 auto 12px;animation:voa 1.1s ease-in-out infinite}
@keyframes voa{0%{transform:translate(-40px,10px) rotate(70deg);opacity:0}30%,70%{opacity:1}100%{transform:translate(40px,-10px) rotate(70deg);opacity:0}}
@view-transition{navigation:auto}

/* a trilha */
.route{position:relative;margin-top:36px;padding:6px 0 10px}
.route svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin:0 0 var(--g,40px);width:fit-content}
.stop.l{margin-left:var(--x,4%)}
.stop.r{margin-left:auto;margin-right:var(--x,4%);flex-direction:row-reverse;text-align:right}
/* paradas de tamanhos diferentes, todas "respirando" em ritmos diferentes, com um anel que se espalha */
.node{position:relative;width:var(--s,80px);height:var(--s,80px);border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#fff;
  animation:breathe var(--t,3.4s) ease-in-out var(--d,0s) infinite;
  background:var(--glass2);border:1.5px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 26px -10px rgba(0,0,0,.55);transition:transform .15s}
.node:hover{transform:translateY(-2px)}
.node:active{transform:scale(.95)}
.node svg{width:50%;height:50%}
.node::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none;
  animation:ring var(--t,3.4s) ease-out var(--d,0s) infinite}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.075}}
@keyframes ring{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(1.55);opacity:0}}
.node.next{background:#fff;color:var(--pine);animation:breathe 1.6s ease-in-out infinite,pulse 1.6s infinite}
.node.next::after{border-color:#fff;border-width:2px;animation-duration:1.6s;animation-delay:0s}
.node.next svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 -3px;rotate:-6deg}}
.node.feito::after{border-color:rgba(127,227,220,.6)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.node.feito{background:linear-gradient(160deg,var(--lake),var(--lake-d));border-color:#fff}
.stop .lbl b{display:block;font-weight:500;font-size:21px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.stop .lbl span{font-size:14px;color:var(--muted);font-weight:300}
.stamp{position:absolute;right:-12px;top:-12px;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--lake-d);display:grid;place-items:center;transform:rotate(-12deg);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.stamp svg{width:20px;height:20px}
.stamp.new{animation:thump .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:scale(2.4) rotate(10deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.deco-rota{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco-rota span{color:#fff}
.deco-rota svg{display:block;width:100%;height:auto}
.nuvem{width:110px;opacity:.16;animation:drift 26s linear infinite}
.nuvem.b{width:76px;opacity:.12;animation-duration:34s;animation-delay:-14s}
@keyframes drift{from{translate:-130px 0}to{translate:110vw 0}}
.balao{width:34px;right:8%;top:41%;opacity:.85;animation:float 5s ease-in-out infinite}
@keyframes float{50%{translate:0 -14px;rotate:4deg}}
.brilho{width:14px;opacity:0;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;scale:.6}50%{opacity:.9;scale:1}}
.plane{position:absolute;left:0;top:0;width:34px;height:34px;color:#fff;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));z-index:2}
.end{display:flex;align-items:center;gap:8px;justify-content:center;color:#fff;font-weight:300;font-size:15px;margin:0 0 22px}
.end svg{width:22px;height:22px}

.send{margin:4px 0 0}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:8px}

/* boas-vindas: o nome do aluno */
.welcome{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:20px;color:#fff}
.welcome .marca{margin-bottom:auto;padding-top:12vh}
.welcome .logo svg{width:52px;height:52px}.welcome .logo b{font-size:40px}.welcome .logo i{font-size:15px;margin-top:6px}
.welcome .by{font-size:14px;padding-left:64px}
.welcome h1{font-weight:300;font-size:38px;line-height:1.1}
.welcome p{margin:0 0 6px;font-weight:300;font-size:17px;color:var(--ink);opacity:.92}
.field{width:100%;border:1px solid var(--edge);background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:18px;padding:16px 18px;font:500 19px/1.2 var(--f);color:#fff;outline:none}
.field::placeholder{color:rgba(255,255,255,.6);font-weight:300}
.field:focus{border-color:#fff;background:rgba(255,255,255,.22)}

/* botões */
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 18px;font-weight:600;font-size:17px;letter-spacing:.03em;cursor:pointer;text-align:center;text-decoration:none;
  background:linear-gradient(180deg,#38D1CA,var(--lake));color:#05302F;box-shadow:0 5px 0 var(--lake-d),0 12px 24px -12px rgba(0,0,0,.5);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lake-d)}
.btn.ok{background:linear-gradient(180deg,#6DF0C6,var(--good));box-shadow:0 5px 0 var(--good-d)}
.btn.bad{background:linear-gradient(180deg,#FF9C8F,var(--bad));color:#3A0D08;box-shadow:0 5px 0 var(--bad-d)}
.btn.sun{background:linear-gradient(180deg,#FFE08F,var(--sun));color:#3A2604;box-shadow:0 5px 0 var(--sun-d)}
.btn:disabled{background:rgba(255,255,255,.16);box-shadow:0 5px 0 rgba(0,0,0,.25);color:rgba(255,255,255,.5);cursor:default}
.btn.ghost{background:#fff;color:var(--pine);box-shadow:0 5px 0 rgba(0,0,0,.18)}

/* atividade */
.act-top{display:flex;align-items:center;gap:12px;padding:8px 0 20px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);cursor:pointer;color:#fff;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.bar{position:relative;flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.16);overflow:visible}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lake-l),#fff);border-radius:999px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.bar b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;color:#fff;transition:left .5s cubic-bezier(.2,.9,.3,1.2);filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.kicker{font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lake-l)}
.q{font-weight:300;font-size:27px;line-height:1.25;color:#fff;margin:10px 0 24px}
.q .pt{display:inline-block;font-weight:500;font-size:22px;background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:6px 14px;margin-top:10px}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:18px;padding:15px 16px;font-weight:500;font-size:17px;text-align:left;cursor:pointer;color:#fff;transition:transform .1s,background .15s}
.opt:active{transform:scale(.98)}
.opt.sel{background:#fff;color:var(--pine);border-color:#fff}
.opt.right{background:rgba(65,226,176,.25);border-color:var(--good);color:#fff}
.opt.wrong{background:rgba(255,126,110,.25);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.out{opacity:.4;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
.speak{width:100px;height:100px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;border:0;background:linear-gradient(160deg,#38D1CA,var(--lake-d));box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;color:#fff;animation:pulse 2s infinite}
.speak svg{width:46px;height:46px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px 0;border-bottom:1px solid var(--edge);margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:1px solid var(--edge);background:#fff;color:var(--pine);border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tile.used{visibility:hidden}
.gapline{font-size:24px;font-weight:300;line-height:1.6}
.gapline .gap{display:inline-block;min-width:96px;border-bottom:2px solid var(--lake-l);text-align:center;color:var(--lake-l);font-weight:500}

/* rodapé */
.foot{position:fixed;inset:auto 0 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(9,36,37,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.12);z-index:5;transition:background .25s}
.foot .in{max-width:520px;margin:0 auto;display:grid;gap:12px}
.peek{justify-self:center;border:0;background:none;padding:4px 10px;color:rgba(255,255,255,.82);font-weight:400;font-size:14px;letter-spacing:.02em;
  text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.peek svg{width:16px;height:16px}
.peek.solo{margin-top:18px;display:flex;margin-inline:auto}
/* a resposta aparece como dica e some sozinha */
.dica{position:fixed;left:50%;bottom:190px;translate:-50% 0;z-index:9;max-width:min(88vw,460px);text-align:center;
  background:rgba(255,255,255,.94);color:var(--pine);border-radius:16px;padding:10px 16px;font-weight:500;font-size:16px;line-height:1.35;
  box-shadow:0 12px 30px rgba(0,0,0,.3);animation:up .25s;transition:opacity .6s,translate .6s}
.dica span{display:block;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--lake-d);margin-bottom:2px}
.dica.sai{opacity:0;translate:-50% 8px}
.dica.alto{bottom:auto;top:96px}
.foot.good{background:rgba(20,95,75,.88)}
.foot.bad{background:rgba(110,35,28,.88)}
.fb{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;animation:up .25s}
.fb small{display:block;font-size:15px;font-weight:300;opacity:.95}
.fb .ic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto}
.foot.good .ic{color:var(--good-d)} .foot.bad .ic{color:var(--bad-d)}
.fb .ic svg{width:22px;height:22px}

/* vídeo */
.vid{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--edge);box-shadow:0 18px 40px -20px rgba(0,0,0,.7);margin-bottom:16px}
.vid video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.vid.ouvir img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;filter:brightness(.72) saturate(.95)}
.vid button{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--pine);cursor:pointer;display:grid;place-items:center}
.vid button svg{width:32px;height:32px}

/* música */
.player{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,217,174,.22),rgba(247,191,203,.18));border:1px solid var(--edge);border-radius:24px;padding:14px;margin-bottom:18px}
.player .disc{width:64px;height:64px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle,var(--glow) 0 16%,#0B2B2C 17% 28%,#1C5752 29% 100%)}
.player.playing .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player b{display:block;font-weight:500;font-size:20px}
.player span{font-size:13px;color:var(--muted);font-weight:300}
.player .pp{margin-left:auto;width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:var(--pine);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.player .pp svg{width:24px;height:24px}
.lyrics{display:grid;gap:8px;margin-bottom:16px}
.lyr{font-size:20px;font-weight:300;color:rgba(255,255,255,.45);transition:color .2s,transform .2s;line-height:1.55}
.lyr.now{color:#fff;transform:translateX(6px)}
.lgap{display:inline-block;min-width:84px;padding:0 8px;border-radius:10px;background:var(--glass);border:1px dashed var(--lake-l);color:var(--lake-l);text-align:center;cursor:pointer;font-weight:500}
.lgap.fill{border-style:solid;background:#fff;color:var(--pine)}
.lgap.right{border-color:var(--good);background:rgba(65,226,176,.3);color:#fff}
.lgap.wrong{border-color:var(--bad);background:rgba(255,126,110,.3);color:#fff}
.lgap.right{cursor:default}

/* jogos */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{perspective:700px;aspect-ratio:1/1;border:0;padding:0;background:none;cursor:pointer}
.card .in{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.flip .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;display:grid;border-radius:18px;place-items:center;backface-visibility:hidden;font-weight:500;padding:6px;text-align:center}
.card .f{background:linear-gradient(160deg,rgba(56,209,202,.55),rgba(15,127,122,.75));border:1px solid var(--edge);color:#fff}
.card .f svg{width:28px;height:28px;opacity:.95}
.card .b{background:#fff;color:var(--pine);transform:rotateY(180deg);font-size:15px}
.card .b.pt{color:var(--lake-d)}
.card.done .b{background:var(--good);color:#05302F}
.card.done{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.hint{color:var(--muted);font-weight:300;margin:-12px 0 18px}
.lyrics + .hint{margin:6px 0 18px;font-size:14px}

/* notícia (papel de jornal sobre o vidro) */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 18px 22px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);font-family:var(--f-news);rotate:-.5deg}
.mast{text-align:center;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
.mast h2{font-family:var(--f-mast);font-weight:400;font-size:40px;line-height:1}
.mast .ed{display:flex;justify-content:space-between;gap:8px;font-family:var(--f);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--paper-ink);margin-top:6px;padding-top:4px}
.sec{font-family:var(--f);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B5452F;margin-top:14px}
.paper h3{font-family:var(--f-news);font-size:27px;line-height:1.15;margin:4px 0 6px}
.deck{font-style:italic;margin:0 0 12px;color:#5A5243;font-size:16.5px}
.paper figure{margin:0 0 12px}
.paper figure img{display:block;width:100%;border-radius:2px;filter:saturate(.9) sepia(.08)}
.paper figcaption{font-size:12px;color:#6E6555;margin-top:4px;font-style:italic}
.cols p{margin:0 0 11px;line-height:1.65;font-size:16.5px}
.cols p:first-child::first-letter{float:left;font-size:46px;line-height:.9;padding:4px 6px 0 0;font-weight:700}
@media (min-width:500px){.cols{columns:2;column-gap:18px;column-rule:1px solid #D9CFB8}}
.gl{border-bottom:2px dotted #C2573F;cursor:pointer}
.paper .btn.ghost{background:var(--paper-ink);color:var(--paper);box-shadow:0 4px 0 #000}
.gloss{position:fixed;left:50%;bottom:130px;translate:-50% 0;background:#fff;color:var(--pine);border-radius:14px;padding:8px 14px;font-weight:600;z-index:9;animation:up .2s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@keyframes up{from{translate:-50% 10px;opacity:0}}
.fb{translate:0 0}
.tf{display:grid;grid-template-columns:1fr auto;gap:14px 12px;align-items:center;margin-top:22px}
.tf p{margin:0;font-weight:400;font-size:16.5px}
.tf .yn{display:flex;gap:6px}
.tf .yn button{border:1px solid var(--edge);background:var(--glass);color:#fff;border-radius:999px;padding:7px 13px;font-weight:500;cursor:pointer}
.tf .yn button.sel{background:#fff;color:var(--pine)}
.tf .yn button.right{background:rgba(65,226,176,.3);border-color:var(--good);color:#fff}
.tf .yn button.wrong{background:rgba(255,126,110,.3);border-color:var(--bad);color:#fff}
.tf .yn button:disabled{cursor:default}

/* fim de seção */
.done{text-align:center;padding-top:40px}
.done .big{position:relative;width:170px;height:170px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,#fff 0 50%,rgba(255,255,255,.12) 51% 100%);color:var(--lake-d);animation:thump .6s cubic-bezier(.2,1.6,.4,1)}
.done .big svg{width:70px;height:70px}
.done .big::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);animation:spin 18s linear infinite}
.done h2{font-weight:300;font-size:34px;color:#fff}
.done p{font-weight:300;color:var(--muted)}
.xpbox{white-space:nowrap;display:inline-flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:8px 18px;font-weight:600;font-size:20px;color:var(--sun);margin:8px 0 22px}
.conf{position:fixed;top:-10px;width:9px;height:13px;z-index:20;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{translate:-6px}75%{translate:6px}}
.bounce{animation:pop .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

/* a trilha pontilhada passa pelas 5 paradas; o avião voa pela própria trilha até a próxima */
function desenharRota(alvo, animar){
  var r = $("#route"), svg = $("#path"); if (!r) return;
  var nodes = $$(".node", r), rr = r.getBoundingClientRect();
  var pts = nodes.map(function(n){ var b=n.getBoundingClientRect(); return [b.left-rr.left+b.width/2, b.top-rr.top+b.height/2]; });
  var ini = [pts[0][0]+70, -10];
  var all = [ini].concat(pts);
  var d = "M"+ini[0]+" "+ini[1];
  for (var i=1;i<all.length;i++){ var a=all[i-1], b=all[i], dy=(b[1]-a[1])*.55; d += " C"+a[0]+" "+(a[1]+dy)+" "+b[0]+" "+(b[1]-dy)+" "+b[0]+" "+b[1]; }
  svg.setAttribute("viewBox","0 0 "+rr.width+" "+rr.height);
  svg.innerHTML = '<path id="trilha" d="'+d+'" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.4" stroke-dasharray="1.5 9" stroke-linecap="round"/>';
  var path = $("#trilha"), L = path.getTotalLength();
  /* comprimento da trilha em cada parada (procura o ponto mais perto) */
  function compr(pt){ var best=0, bd=1e9; for (var s=0;s<=L;s+=4){ var q=path.getPointAtLength(s), dd=(q.x-pt[0])*(q.x-pt[0])+(q.y-pt[1])*(q.y-pt[1]); if(dd<bd){bd=dd;best=s;} } return best; }
  var marcos = pts.map(compr).concat([L]);
  /* o avião espera no meio do caminho até a próxima parada (sem cobrir nenhuma bola); no fim, na última */
  var destino = alvo >= pts.length ? L : alvo === 0 ? marcos[0] - 60 : marcos[alvo-1] + (marcos[alvo] - marcos[alvo-1]) * .5;
  var origem = (POS != null && animar) ? POS : Math.max(0, destino - 160);
  destino = Math.max(destino, 0); POS = destino;
  var pl = $("#plane");
  function poe(s){ var q=path.getPointAtLength(s), q2=path.getPointAtLength(Math.min(L,s+1)), ang=Math.atan2(q2.y-q.y,q2.x-q.x)*180/Math.PI;
    pl.style.transform = "translate("+(q.x-17)+"px,"+(q.y-17)+"px) rotate("+(ang+90)+"deg)"; }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ poe(destino); return; }
  var t0 = null, dur = 1600;
  function passo(t){ if(!t0) t0=t; var k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; poe(origem+(destino-origem)*e); if(k<1) requestAnimationFrame(passo); }
  requestAnimationFrame(passo);
}

function jogos(){
  var J = AULA.jogos; tela(); barra(0); tirarRodape();
  var cartas = emb([].concat.apply([], J.memoria.map(function(p,i){ return [{t:p[0], par:i, pt:false}, {t:p[1], par:i, pt:true}]; })));
  $("#corpo").innerHTML = '<div class="kicker">Games · 1 / 2</div><div class="q">Memory: find the pairs</div><p class="hint">English word + Portuguese word</p>'
    + '<div class="mem">'+cartas.map(function(c,i){ return '<button class="card" data-i="'+i+'" aria-label="Card"><span class="in"><span class="f">'+ICON.plane+'</span><span class="b'+(c.pt?' pt':'')+'">'+esc(c.t)+'</span></span></button>'; }).join("")+'</div>';
  var abertas = [], achados = 0, travado = false;
  $$(".card").forEach(function(el){ el.onclick = function(){
    if (travado || el.classList.contains("flip") || el.classList.contains("done")) return;
    var c = cartas[+el.getAttribute("data-i")]; el.classList.add("flip"); if (!c.pt) falar(c.t); abertas.push(el);
    if (abertas.length === 2){ travado = true;
      var a = cartas[+abertas[0].getAttribute("data-i")], b = cartas[+abertas[1].getAttribute("data-i")];
      if (a.par === b.par){ somCerto(); abertas.forEach(function(x){ x.classList.add("done"); }); abertas=[]; travado=false; achados++; barra(achados/J.memoria.length/2);
        if (achados === J.memoria.length) setTimeout(letras, 700); }
      else { setTimeout(function(){ somErro(); abertas.forEach(function(x){ x.classList.remove("flip"); }); abertas=[]; travado=false; }, 800); }
    } }; });
  function letras(){
    var W = J.letras, i = 0;
    function mostra(){
      var w = W[i], ls = emb(w.en.split("")), tw = 0; barra(.5 + i/W.length/2);
      $("#corpo").innerHTML = '<div class="kicker">Games · 2 / 2</div><div class="q">Pack the letters<br><span class="pt">'+esc(w.pt)+'</span></div>'
        + '<div class="tiles" id="linha" style="justify-content:center;font-size:22px"></div><div class="bank">'+ls.map(function(l){return '<button class="tile" style="min-width:48px;font-size:22px">'+l+'</button>';}).join("")+'</div>';
      $$(".bank .tile").forEach(function(b){ b.onclick = function(){
        if (b.classList.contains("used")) return; b.classList.add("used");
        var t = document.createElement("span"); t.className="tile"; t.style.minWidth="48px"; t.textContent=b.textContent; $("#linha").appendChild(t);
        var feito = $$("#linha .tile").map(function(x){return x.textContent;}).join("");
        if (feito.length === w.en.length){
          var ok = feito === w.en; $("#linha").classList.add(ok?"bounce":"shake");
          if (ok){ falar(w.en.toLowerCase()); feedback(true, w.en.toLowerCase()+" = "+w.pt, function(){ tirarRodape(); i++; if (i<W.length) mostra(); else { barra(1); fimSecao("jogos", 0, 0); } }); }
          else { somErro(); tw++;
            if (tw >= 2 && !$("#peekL")){ var pk = document.createElement("button"); pk.className="peek solo"; pk.id="peekL"; pk.innerHTML=ICON.eye+"Show answer";
              pk.onclick = function(){ dica(w.en); }; $("#corpo").appendChild(pk); }
            setTimeout(function(){ $("#linha").innerHTML=""; $$(".bank .tile").forEach(function(x){x.classList.remove("used");}); $("#linha").classList.remove("shake"); }, 600); }
        } }; });
    }
    mostra();
  }
}

/* ---------- 5 · News: o jornal ---------- */
function noticia(){
  var N = AULA.noticia; tela(); barra(0);
  var gl = N.glossario || {};
  function marca(p){ return esc(p).replace(/\b([A-Za-z-]+)\b/g, function(w){ var k=w.toLowerCase(); return gl[k] ? '<span class="gl" data-g="'+k+'">'+w+'</span>' : w; }); }
  $("#corpo").innerHTML = '<div class="kicker">News</div><div class="q" style="margin-bottom:12px">Read the news. Tap the dotted words.</div>'
    + '<article class="paper"><header class="mast"><h2>'+esc(N.jornal)+'</h2><div class="ed"><span>'+esc(N.data)+'</span><span>'+esc(N.edicao)+'</span></div></header>'
    + '<div class="sec">'+esc(N.secao)+'</div><h3>'+esc(N.manchete)+'</h3><p class="deck">'+esc(N.linha_fina)+'</p>'
    + '<figure><img src="'+midia(N.foto)+'" alt=""><figcaption>'+esc(N.legenda)+'</figcaption></figure>'
    + '<div class="cols">'+N.paragrafos.map(function(p){return '<p>'+marca(p)+'</p>';}).join("")+'</div>'
    + '<button class="btn ghost" id="ler" style="margin-top:6px">'+'Listen to the news</button></article>'
    + '<div class="tf">'+N.perguntas.map(function(q,i){ return '<p>'+(i+1)+'. '+esc(q.frase)+'</p><div class="yn" data-q="'+i+'"><button data-v="1">True</button><button data-v="0">False</button></div>'; }).join("")+'</div>';
  $("#ler").onclick = function(){ falar(N.manchete+". "+N.paragrafos.join(" ")); };
  $$(".gl").forEach(function(s){ s.onclick = function(){ var g=$(".gloss"); if(g) g.remove(); g=document.createElement("div"); g.className="gloss"; g.textContent=s.textContent+" = "+gl[s.getAttribute("data-g")]; document.body.appendChild(g); falar(s.textContent); setTimeout(function(){ g.remove(); }, 1800); }; });
  var resp = {}, acao = null, tent = 0, ac1 = 0;
  function pronto(){ acao = rodape("Check", Object.keys(resp).length < N.perguntas.length); acao.onclick = checar; }
  pronto();
  $$(".yn button").forEach(function(b){ b.onclick = function(){ if (b.disabled) return; var q=b.parentNode; $$("button",q).forEach(function(x){x.classList.remove("sel");}); b.classList.add("sel");
    resp[q.getAttribute("data-q")] = b.getAttribute("data-v")==="1"; acao.disabled = Object.keys(resp).length < N.perguntas.length; barra(Object.keys(resp).length/N.perguntas.length*.9); }; });
  function checar(){
    var ac = 0, faltam = []; tent++;
    N.perguntas.forEach(function(q,i){ var ok = resp[i] === q.certa, bs = $$('.yn[data-q="'+i+'"] button');
      if (ok){ ac++; bs.forEach(function(b){ if (b.classList.contains("sel")) b.classList.add("right"); b.disabled = true; }); }
      else { bs.forEach(function(b){ if (b.classList.contains("sel")) b.classList.add("wrong"); }); faltam.push((i+1)+". "+(q.certa?"True":"False")+(q.porque?" · "+q.porque:"")); } });
    if (tent === 1) ac1 = ac;
    barra(ac/N.perguntas.length);
    if (ac === N.perguntas.length){ feedback(true, tent===1 ? "All "+ac+" right!" : "Now they're all right!", function(){ fimSecao("noticia", ac1, N.perguntas.length); }, true); return; }
    errou(tent, faltam.join("  "), function(){
      N.perguntas.forEach(function(q,i){ if (resp[i] !== q.certa){ delete resp[i]; $$('.yn[data-q="'+i+'"] button').forEach(function(b){ b.classList.remove("sel","wrong"); }); } });
      pronto();
    });
  }
}

["copy","cut","contextmenu","selectstart","dragstart"].forEach(function(ev){
  document.addEventListener(ev, function(e){ var t = e.target; if (t && t.closest && t.closest("input")) return; e.preventDefault(); }, true); });
document.addEventListener("keydown", function(e){ if ((e.ctrlKey || e.metaKey) && /^[acspux]$/i.test(e.key) && !(e.target.closest && e.target.closest("input"))) e.preventDefault(); }, true);
