  if (!D) {
    document.querySelector(".tabs").style.display = "none";
    $("review").innerHTML = '<div class="card tranca"><strong>Material exclusivo dos alunos do Teacher Walden.</strong>' +
      '<p class="ex">Abra pelo link que o professor enviou, ou digite o código de acesso.</p>' +
      '<input id="cod" type="text" inputmode="text" autocomplete="off" placeholder="Código de acesso" />' +
      '<button type="button" class="ir" id="entrar">Entrar</button><p class="sub" id="codErro"></p></div>';
    $("entrar").addEventListener("click", function () {
      var c = $("cod").value.trim().toLowerCase();
      if (abre(c)) { try { localStorage.setItem(CK, c); } catch (e) {} location.reload(); }
      else { $("codErro").textContent = "Código incorreto."; }
    });
    return;
  }
  try { localStorage.setItem(CK, k); } catch (e) {}
  var ALUNO = par.a || "";
  try { if (ALUNO) localStorage.setItem(CK + ":a", ALUNO); else ALUNO = localStorage.getItem(CK + ":a") || ""; } catch (e) {}
  /* o endereco nao fica com o codigo `a vista */
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  /* copiar, menu do botao direito, arrastar, imprimir e salvar: bloqueados (menos nas caixas de resposta) */
  function livre(ev) { return ev.target && ev.target.closest && ev.target.closest("textarea, input"); }
  ["copy", "cut", "contextmenu", "dragstart", "selectstart"].forEach(function (tipo) {
    document.addEventListener(tipo, function (ev) { if (!livre(ev)) ev.preventDefault(); });
  });
  document.addEventListener("keydown", function (ev) {
    var t = (ev.key || "").toLowerCase();
    if ((ev.ctrlKey || ev.metaKey) && ["c", "x", "s", "p", "u", "a"].indexOf(t) >= 0 && !livre(ev)) ev.preventDefault();
  });
  var SID = par.s || "";
  try { if (SID) localStorage.setItem(CK + ":s", SID); else SID = localStorage.getItem(CK + ":s") || ""; } catch (e) {}
  function dono(nomeDoAluno) {
    if (!nomeDoAluno || document.querySelector(".dono")) return;
    var nomeLimpo = String(nomeDoAluno).replace(/[<>&"]/g, "").slice(0, 40);
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190'><text x='10' y='120' transform='rotate(-24 150 95)' font-family='Arial' font-size='15' font-weight='700' fill='rgba(5,8,20,0.055)'>" + nomeLimpo + " · Teacher Walden</text></svg>";
    document.body.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
    var d0 = document.createElement("div"); d0.className = "dono"; d0.textContent = "Material exclusivo de " + nomeLimpo;
    document.querySelector("header").appendChild(d0);
  }
  dono(ALUNO);
  /* o que o aluno destacou na aula: um arquivinho so' dele, ao lado da tarefa
     (a/<s>.txt), embaralhado com o mesmo codigo. Logo depois do envio o site
     ainda nao tem o arquivo: tenta de novo algumas vezes, sem incomodar. */
  function destaques(tentativa) {
    if (!SID || !window.fetch || location.protocol === "file:") return;
    fetch("a/" + encodeURIComponent(SID) + ".txt", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("ainda nao"); return r.text(); })
      .then(function (t) {
        var x = dec(t, k);
        if (!x) return;
        dono(x.n);
        var lista = (x.m || []).filter(Boolean);
        if (!lista.length || document.getElementById("meus")) return;
        var box = document.createElement("div");
        box.id = "meus";
        box.innerHTML = '<h2>From your class</h2><div class="card meus"><p class="sub">O que voc\u00ea destacou na aula' + (x.d ? " de " + esc(x.d) : "") + ":</p><ul>" +
          lista.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
        var rv = document.getElementById("review");
        rv.insertBefore(box, rv.firstChild);
      })
      .catch(function () { if (tentativa < 6) setTimeout(function () { destaques(tentativa + 1); }, 20000); });
  }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  /* embaralha sempre igual para a mesma aula: o aluno que volta acha a tarefa como deixou */
  var semente = 0; for (var i = 0; i < D.arq.length; i++) semente = (semente * 31 + D.arq.charCodeAt(i)) >>> 0;
  function rnd() { semente = (semente * 1664525 + 1013904223) >>> 0; return semente / 4294967296; }
  function mistura(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function marca(frase, termo) {
    var i = frase.toLowerCase().indexOf(termo.toLowerCase());
    return i < 0 ? esc(frase) : esc(frase.slice(0, i)) + "<b>" + esc(frase.slice(i, i + termo.length)) + "</b>" + esc(frase.slice(i + termo.length));
  }
  function falar(t) {
    try {
      var u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.92;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
  var temVoz = "speechSynthesis" in window;

  $("kick").textContent = D.nivel + " · " + D.curso + " · " + (String(D.n) === "0" ? "Demo" : "Lesson " + D.n) + " · Homework";
  $("tema").textContent = D.tema; $("hook").textContent = D.hook; $("curso").textContent = D.curso;

  /* ---------------- pagina 1 ---------------- */
  var h = "", grupo = "";
  D.itens.forEach(function (it, k) {
    if (it.g !== grupo) { grupo = it.g; h += "<h2>" + esc(grupo) + "</h2>"; }
    h += '<div class="card" data-k="' + k + '"><div class="top"><span class="term">' + esc(it.t) + "</span>" +
      (it.ipa ? '<span class="ipa">' + esc(it.ipa) + "</span>" : "") +
      (temVoz ? '<button type="button" class="ouvir" data-fala="' + k + '">\u25B6 Listen</button>' : "") + "</div>" +
      (it.ex ? '<p class="ex">' + marca(it.ex, it.t) + "</p>" : "") +
      '<button type="button" class="ver">Ver tradu\u00e7\u00e3o e dica</button>' +
      '<div class="pt"><strong>' + esc(it.pt) + "</strong>" + esc(it.tip) + "</div></div>";
  });
  if (D.tool) {
    h += '<h2>Your tool this week</h2><div class="card tool"><a href="' + esc(D.tool.url) + '" target="_blank" rel="noopener">' + esc(D.tool.nome) + " \u2197</a>" +
      '<p class="ex">' + esc(D.tool.oque) + "</p><ol>" + D.tool.passos.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ol>" +
      '<div class="missao"><strong>Miss\u00e3o da semana: </strong>' + esc(D.tool.missao) + "</div></div>";
  }
  h += '<button type="button" class="ir" id="irPratica">Go to Practice \u2192</button>';
  $("review").innerHTML = h;
  destaques(0);

  /* ---------------- pagina 2 ---------------- */
  var termos = D.itens.map(function (x) { return x.t; });
  function opcoes(certa, fonte, n) {
    var outras = mistura(fonte.filter(function (x) { return x !== certa; })).slice(0, n - 1);
    return mistura(outras.concat([certa]));
  }
  var Q = [], p = "", bloco = 0;
  function titulo(t, sub) { bloco++; p += "<h2>" + bloco + " \u00b7 " + t + "</h2>" + (sub ? '<p class="sub">' + sub + "</p>" : ""); }
  function escolha(tipo, html, ops, certa, exp, larga) {
    var id = Q.length; Q.push({ tipo: tipo, certa: certa });
    p += '<div class="q" data-q="' + id + '">' + html + '<div class="ops">' +
      ops.map(function (o) { return '<button type="button" class="op' + (larga ? " larga" : "") + '" data-v="' + esc(o) + '">' + esc(o) + "</button>"; }).join("") +
      "</div>" + (exp ? '<div class="exp">' + esc(exp) + "</div>" : "") + "</div>";
  }
  if (D.gaps.length) {
    titulo("Complete", "Toque na palavra que completa a frase.");
    mistura(D.gaps).forEach(function (g) {
      escolha("gap", "<p>" + esc(g.q).replace(/_{3,}/, '<span class="gap">&nbsp;</span>') + "</p>", opcoes(g.a, termos, 4), g.a, g.e);
    });
  }
  var defs = Object.keys(D.defs);
  if (defs.length) {
    titulo("Which one is it?", "Leia a defini\u00e7\u00e3o e escolha o termo.");
    mistura(defs).slice(0, 6).forEach(function (t) {
      escolha("def", "<p>" + esc(D.defs[t]) + "</p>", opcoes(t, defs, 4), t, "");
    });
  }
  if (D.gram && D.gram.length) {
    titulo("Grammar", esc(D.gram_t));
    D.gram.forEach(function (g) {
      escolha("gram", "<p>" + esc(g.q).replace(/_{3,}/, '<span class="gap">&nbsp;</span>') + "</p>", mistura(g.ops.slice()), g.a, g.e);
    });
  }
  if (D.fix.length) {
    titulo("Fix it", "S\u00f3 uma das duas frases est\u00e1 certa. Qual?");
    D.fix.forEach(function (f) { escolha("fix", "", mistura([f.x, f.ok]), f.ok, f.e, true); });
  }
  if (D.prep.length) {
    titulo("The little word", "Qual palavra entra no espa\u00e7o? O tra\u00e7o (\u2014) quer dizer \u201cnenhuma\u201d.");
    var PREPS = ["of", "to", "for", "on", "with", "in", "at", "from", "about", "\u2014", "up", "over", "as"];
    D.prep.forEach(function (v) {
      escolha("prep", "<p>" + esc(v.q).replace(/_{3,}/, '<span class="gap">&nbsp;</span>') + "</p>", opcoes(v.a, PREPS.indexOf(v.a) < 0 ? PREPS.concat([v.a]) : PREPS, 4), v.a, v.e);
    });
  }
  if (D.up.length) {
    titulo("Say it better", "A mesma ideia, no n\u00edvel da aula. Toque nas palavras na ordem certa.");
    D.up.forEach(function (u) {
      var id = Q.length, pecas = u.b.split(" ");
      Q.push({ tipo: "ordem", certa: u.b });
      p += '<div class="q" data-q="' + id + '"><p class="n">SIMPLES</p><p>' + esc(u.s) + '</p><div class="resp"></div><div class="pecas">' +
        mistura(pecas).map(function (w) { return '<button type="button" class="peca">' + esc(w) + "</button>"; }).join("") +
        '</div><button type="button" class="mini" data-acao="conferir">Check</button><div class="exp"><strong>' + esc(u.b) + "</strong> \u2014 " + esc(u.e) + "</div></div>";
    });
  }
  if (D.trans.length) {
    titulo("Translate into English", "Escreva, depois compare com o modelo e diga se acertou.");
    D.trans.forEach(function (t) {
      var id = Q.length; Q.push({ tipo: "trans", certa: t.en });
      p += '<div class="q" data-q="' + id + '"><p>' + esc(t.pt) + '</p><textarea placeholder="Type in English\u2026"></textarea>' +
        '<button type="button" class="mini" data-acao="modelo">Ver o modelo</button>' +
        '<div class="modelo"><strong>' + esc(t.en) + "</strong>" + (t.alt ? "<small>" + esc(t.alt) + "</small>" : "") +
        '<div><button type="button" class="mini cheio" data-acao="sim">Acertei</button><button type="button" class="mini" data-acao="nao">Ainda n\u00e3o</button></div></div></div>';
    });
  }
  if (D.speak.length) {
    bloco++;
    p += "<h2>" + bloco + ' \u00b7 Speak about it</h2><p class="sub">Responda em voz alta. Se quiser, grave um \u00e1udio e mande para o professor.</p><div class="card speak"><ol>' +
      D.speak.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
  }
  p = '<div class="placar"><span id="feitas">0</span><span class="barra"><i id="barra"></i></span><span id="pts"></span></div>' + p +
    '<div class="fim"><div class="kick">Your score</div><div class="num" id="num">\u2014</div><div class="sub" id="msg" style="margin:6px 0 0">Responda os exerc\u00edcios para ver o resultado.</div>' +
    '<a class="zap" id="zap" target="_blank" rel="noopener">Enviar meu resultado ao professor</a>' +
    '<button type="button" class="refazer" id="refazer">Apagar as respostas e refazer</button></div>';
  $("practice").innerHTML = p;

  /* ---------------- respostas ---------------- */
  var KEY = "preply-tarefa:" + D.arq, R = {};
  try { R = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { R = {}; }
  function grava() { try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) {} }
  function norm(t) { return String(t).toLowerCase().replace(/[\u2019']/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }
  function pinta(el, r) {
    var q = Q[+el.getAttribute("data-q")];
    if (!r) return;
    if (q.tipo === "ordem") {
      el.classList.add("feita");
      var resp = el.querySelector(".resp");
      resp.style.borderColor = r.ok ? "#9fd6b5" : "#f0b4ad";
      resp.style.background = r.ok ? "var(--ok-soft)" : "var(--no-soft)";
      if (r.v && !resp.children.length) resp.textContent = r.v;
      el.querySelector(".pecas").style.display = "none";
      el.querySelector('[data-acao="conferir"]').style.display = "none";
    } else if (q.tipo === "trans") {
      el.classList.add("visto");
      el.querySelector("textarea").value = r.v || "";
      el.querySelector('[data-acao="modelo"]').style.display = "none";
      if (r.ok !== null && r.ok !== undefined) {
        el.classList.add("feita");
        el.querySelector(".modelo").style.background = r.ok ? "var(--ok-soft)" : "var(--no-soft)";
        el.querySelectorAll('[data-acao="sim"],[data-acao="nao"]').forEach(function (b) { b.style.display = "none"; });
      }
    } else {
      el.classList.add("feita");
      el.querySelectorAll(".op").forEach(function (b) {
        var v = b.getAttribute("data-v");
        if (v === q.certa) b.classList.add("certa"); else if (v === r.v) b.classList.add("errada");
      });
      var g = el.querySelector(".gap"); if (g) g.textContent = q.certa;
    }
  }
  function placar() {
    var feitas = 0, certas = 0;
    Q.forEach(function (q, i) { var r = R[i]; if (r && r.ok !== null && r.ok !== undefined) { feitas++; if (r.ok) certas++; } });
    $("feitas").textContent = feitas + "/" + Q.length;
    $("barra").style.width = (Q.length ? Math.round(100 * feitas / Q.length) : 0) + "%";
    $("pts").textContent = certas + " certas";
    if (feitas) {
      $("num").textContent = certas + " / " + Q.length;
      $("msg").textContent = feitas < Q.length ? "Faltam " + (Q.length - feitas) + " para terminar." : (certas === Q.length ? "Perfect!" : "Done! Releia as que ficaram em vermelho.");
    }
    var txt = "Hi Teacher Walden! Homework: " + D.nivel + " " + (String(D.n) === "0" ? "Demo" : "Lesson " + D.n) + " \u2014 " + D.tema + ".\nScore: " + certas + "/" + Q.length + " (answered " + feitas + ").";
    $("zap").href = "https://wa.me/" + D.whats + "?text=" + encodeURIComponent(txt);
  }
  document.querySelectorAll(".q").forEach(function (el) { pinta(el, R[+el.getAttribute("data-q")]); });
  placar();

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (b.classList.contains("tab")) {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t === b); });
      document.querySelectorAll(".pg").forEach(function (s) { s.classList.toggle("on", s.id === b.getAttribute("data-pg")); });
      window.scrollTo(0, 0); return;
    }
    if (b.id === "irPratica") { document.querySelector('.tab[data-pg="practice"]').click(); return; }
    if (b.classList.contains("ver")) { b.closest(".card").classList.add("aberto"); return; }
    if (b.classList.contains("ouvir")) { var it = D.itens[+b.getAttribute("data-fala")]; falar(it.t); return; }
    if (b.id === "refazer") { if (confirm("Apagar todas as respostas desta tarefa?")) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } return; }
    var el = b.closest(".q"); if (!el) return;
    var i = +el.getAttribute("data-q"), q = Q[i];
    if (b.classList.contains("op")) {
      if (el.classList.contains("feita")) return;
      var v = b.getAttribute("data-v");
      R[i] = { v: v, ok: v === q.certa }; grava(); pinta(el, R[i]); placar(); return;
    }
    if (b.classList.contains("peca")) {
      if (el.classList.contains("feita")) return;
      (b.parentNode.classList.contains("pecas") ? el.querySelector(".resp") : el.querySelector(".pecas")).appendChild(b); return;
    }
    var acao = b.getAttribute("data-acao");
    if (acao === "conferir") {
      var dita = Array.prototype.map.call(el.querySelectorAll(".resp .peca"), function (x) { return x.textContent; }).join(" ");
      if (!dita) return;
      R[i] = { v: dita, ok: norm(dita) === norm(q.certa) }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "modelo") {
      var escrito = el.querySelector("textarea").value;
      var igual = escrito && norm(escrito) === norm(q.certa);
      R[i] = { v: escrito, ok: igual ? true : null }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "sim" || acao === "nao") {
      R[i] = { v: el.querySelector("textarea").value, ok: acao === "sim" }; grava(); pinta(el, R[i]); placar();
    }
  });
})();
</script>
</body>
</html>
