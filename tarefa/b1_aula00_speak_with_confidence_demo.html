<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>B1 Demo — Homework · Teacher Walden</title>
<meta property="og:title" content="Abrir Homework · B1 Demo" />
<meta property="og:description" content="Speak with confidence at work · 20 exercícios e um vídeo · Teacher Walden" />
<meta property="og:image" content="https://images.unsplash.com/photo-1505373877841-8d25f7d46678?w=1200&amp;h=630&amp;fit=crop&amp;q=75&amp;fm=jpg" />
<meta property="og:type" content="website" />
<meta name="description" content="Review, exercises, a TED talk and your tool of the week · Teacher Walden Nogueira" />
<meta name="theme-color" content="#14284d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* visual 18/11 (v3): o do post preto e branco que o professor mandou — fundo preto, folhas de papel
     flutuando, titulo fino em Poppins com o branco apagando para cinza, botoes de vidro.
     A pilha de folhas da capa e' a tarefa da semana: a foto da aula vira a folha de cima. */
  :root { --ink:#000; --surf:rgba(255,255,255,.045); --surf2:rgba(255,255,255,.08); --line:rgba(255,255,255,.11);
          --paper:#f4f4f2; --text:#ececef; --fog:#9c9ca5; --smoke:#2a2a2f;
          --ok:#8fe3b5; --ok-bg:rgba(143,227,181,.1); --no:#ff9b8f; --no-bg:rgba(255,155,143,.1); --mark:rgba(255,255,255,.16);
          --f:Poppins,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; background:#000; }
  body, body * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  textarea, input { -webkit-user-select:text; user-select:text; }
  img { -webkit-user-drag:none; }
  body { margin:0; background:#000; color:var(--text); font:400 15.5px/1.6 var(--f); }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px 96px; overflow-x:clip; }
  button { font-family:var(--f); }
  :focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* capa: a pilha de folhas */
  .hero { position:relative; text-align:center; padding:14px 0 26px; }
  .topo { position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .topo img { height:110px; width:auto; filter:brightness(0) invert(1); opacity:.92; }
  .topo a { color:var(--fog); text-decoration:none; font-size:12.5px; line-height:1.3; text-align:right; }
  .topo a b { display:block; color:#fff; font-weight:500; font-size:13.5px; }
  .pilha { position:relative; width:min(60%,340px); aspect-ratio:4/3; margin:26px auto 26px; transform:rotate(-7deg); }
  .pilha i { position:absolute; inset:0; border-radius:6px; background:linear-gradient(160deg,#e9e9e6,#9a9a98); box-shadow:0 30px 60px -20px rgba(0,0,0,.9); }
  .pilha i:nth-child(1) { transform:translate(-14px,16px) rotate(4deg); opacity:.55; }
  .pilha i:nth-child(2) { transform:translate(-7px,8px) rotate(2deg); opacity:.75; }
  .pilha .folha { position:absolute; inset:0; border-radius:6px; overflow:hidden; background:#ddd center/cover no-repeat; filter:grayscale(1) contrast(1.08) brightness(.95);
                  box-shadow:0 40px 70px -24px rgba(0,0,0,.95), inset 0 0 0 1px rgba(255,255,255,.4); }
  .pilha .folha::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,0) 40%,rgba(0,0,0,.55)); }
  .solta { position:absolute; z-index:1; pointer-events:none; background:linear-gradient(150deg,#fff,#c9c9c7); }
  .s1 { right:3%; top:150px; width:56px; height:70px; border-radius:3px 26px 3px 3px; transform:rotate(14deg); animation:paira 9s ease-in-out infinite; }
  .s2 { left:-50px; top:19%; width:96px; height:124px; border-radius:8px; filter:blur(9px); opacity:.75; transform:rotate(-18deg); }
  .s3 { right:-34px; bottom:4%; width:84px; height:64px; border-radius:60px 4px 4px 4px; transform:rotate(-24deg); opacity:.9; animation:paira 11s ease-in-out -3s infinite; }
  @keyframes paira { 50% { translate:0 -8px; rotate:3deg; } }
  @media (prefers-reduced-motion:reduce) { .solta { animation:none; } .pg { animation:none !important; } }
  .kick { position:relative; z-index:2; font-weight:300; font-size:14px; color:var(--fog); margin:0; }
  h1 { position:relative; z-index:2; font-weight:200; font-size:clamp(32px,9vw,54px); line-height:1.08; letter-spacing:-.025em; margin:4px auto 12px; max-width:13ch;
       background:linear-gradient(100deg,#fff 0%,#fff 48%,#7d7d84 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-wrap:balance; }
  .hook { position:relative; z-index:2; margin:0 auto; max-width:34ch; font-weight:300; font-size:15px; color:#b9b9c0; }
  .vidro { position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:10px; border-radius:16px; border:1px solid rgba(255,255,255,.16);
           background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.03)); color:#fff; font-weight:400; text-decoration:none; cursor:pointer;
           box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 30px -12px rgba(0,0,0,.9); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .vidro::before { content:""; position:absolute; top:-40%; bottom:-40%; left:52%; width:22%; transform:skewX(-28deg); background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.18),rgba(255,255,255,0)); pointer-events:none; }
  .vidro::after { content:""; position:absolute; left:22%; right:22%; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,#fff,transparent); opacity:.7; }
  .comecar { position:relative; z-index:2; margin-top:22px; padding:15px 30px; font-size:17px; min-width:min(100%,320px); }
  .comecar small { color:var(--fog); font-size:13px; }
  .dono { position:relative; z-index:2; margin:14px 0 0; font-size:12px; color:var(--fog); }

  /* esta semana: o video e o site logo no comeco */
  .semana { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 22px; }
  .mini { display:flex; flex-direction:column; text-align:left; padding:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surf); color:var(--text); cursor:pointer; }
  .mini .th { position:relative; aspect-ratio:16/9; background:#151517 center/cover no-repeat; }
  .mini .th.site { background-position:center; background-color:#fff; }
  .mini .th em { position:absolute; right:7px; bottom:7px; font-style:normal; font-size:11px; color:#fff; background:rgba(0,0,0,.72); border-radius:6px; padding:1px 7px; }
  .mini .th .pl { position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px; border-radius:50%; display:grid; place-items:center;
                  background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .mini .th .pl svg { width:14px; height:14px; margin-left:2px; }
  .mini b { display:block; padding:9px 11px 0; font-weight:500; font-size:13px; line-height:1.3; }
  .mini small { display:block; padding:2px 11px 11px; color:var(--fog); font-size:12px; }

  /* abas: pilula de vidro presa no topo */
  .tabs { position:sticky; top:8px; z-index:6; display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:4px; border-radius:18px; border:1px solid rgba(255,255,255,.14);
          background:rgba(20,20,22,.72); -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 14px 34px -14px rgba(0,0,0,.95); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:1px; padding:8px 2px 7px; border:0; border-radius:14px; background:transparent; color:var(--fog); font-size:12.5px; font-weight:400; cursor:pointer; }
  .tab svg { width:20px; height:20px; stroke-width:1.5; }
  .tab.on { color:#fff; background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)); box-shadow:inset 0 1px 0 rgba(255,255,255,.2); }
  .tab .pin { font-size:10.5px; color:#6e6e76; min-height:14px; }
  .tab.on .pin { color:#c9c9cf; }
  .pg { display:none; } .pg.on { display:block; animation:entra .35s ease; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } }

  h2 { display:flex; align-items:baseline; gap:12px; font-weight:300; font-size:23px; letter-spacing:-.01em; color:#fff; margin:38px 2px 6px; }
  h2 .nb { font-weight:200; font-size:23px; color:#6e6e76; min-width:1.2em; }
  h2 .qt { margin-left:auto; font-size:12.5px; font-weight:400; color:var(--fog); white-space:nowrap; }
  .sub { color:var(--fog); font-size:14px; margin:0 2px 14px; }
  .card { background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 10px; }

  /* review */
  .item .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .term { font-weight:500; font-size:18px; color:#fff; }
  .ipa { color:var(--fog); font-size:13px; font-weight:300; }
  .ouvir { margin-left:auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surf2); color:#fff; display:grid; place-items:center; cursor:pointer; }
  .ouvir svg { width:16px; height:16px; }
  .ex { margin:8px 0 0; color:#cfcfd5; font-weight:300; }
  .ex b { color:#fff; font-weight:500; background:var(--mark); padding:0 4px; border-radius:4px; }
  .ver { margin-top:10px; font-size:13px; font-weight:400; color:#fff; background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(255,255,255,.35); text-underline-offset:3px; }
  .pt { display:none; margin-top:10px; padding:11px 13px; background:rgba(255,255,255,.06); border-radius:10px; font-size:14.5px; color:#d9d9de; font-weight:300; }
  .item.aberto .pt { display:block; } .item.aberto .ver { display:none; }
  .pt strong { display:block; margin-bottom:3px; color:#fff; font-weight:500; }
  .meus ul { margin:6px 0 0 18px; padding:0; } .meus li { margin:0 0 5px; color:#fff; }

  /* practice */
  .placar { position:sticky; top:var(--abas,76px); z-index:5; display:flex; align-items:center; gap:12px; padding:8px 14px; margin:16px 0 0; font-size:12.5px; color:var(--fog);
            border-radius:12px; border:1px solid var(--line); background:rgba(20,20,22,.8); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .barra { flex:1; height:3px; border-radius:99px; background:var(--smoke); overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:linear-gradient(90deg,#8a8a90,#fff); transition:width .4s; }
  .q { background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 10px; }
  .q .n { font-size:12px; color:#76767e; margin:0; }
  .q p { margin:4px 0 14px; font-size:17px; font-weight:300; color:#fff; line-height:1.5; }
  .gap { display:inline-block; min-width:76px; border-bottom:1.5px solid #fff; text-align:center; font-weight:500; padding:0 4px; }
  .ops { display:flex; flex-wrap:wrap; gap:8px; }
  .op { font-size:15px; font-weight:400; padding:10px 15px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#fff; cursor:pointer; text-align:left; transition:background .15s, transform .08s; }
  .op:hover { background:rgba(255,255,255,.11); }
  .op:active { transform:scale(.98); }
  .op.larga { width:100%; }
  .q .op.certa { background:var(--ok-bg); border-color:rgba(143,227,181,.55); color:var(--ok); }
  .q .op.errada { background:var(--no-bg); border-color:rgba(255,155,143,.5); color:var(--no); }
  .q.feita .op { cursor:default; }
  .q.feita .op:not(.certa):not(.errada) { opacity:.45; }
  .exp { display:none; margin-top:12px; font-size:14px; color:#c3c3c9; font-weight:300; border-left:2px solid rgba(255,255,255,.25); padding:2px 0 2px 12px; }
  .exp strong { color:#fff; font-weight:500; }
  .q.feita .exp { display:block; }
  .pecas, .resp { display:flex; flex-wrap:wrap; gap:6px; min-height:46px; }
  .resp { border:1px dashed rgba(255,255,255,.25); border-radius:12px; padding:8px; margin-bottom:8px; }
  .peca { font-size:15px; padding:7px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.1); color:#fff; cursor:pointer; }
  .pecas .peca { background:rgba(255,255,255,.04); }
  textarea { width:100%; min-height:78px; font:300 16px/1.5 var(--f); color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:11px 13px; resize:vertical; background:rgba(0,0,0,.35); }
  textarea::placeholder { color:#66666d; }
  .bt { font-size:14px; font-weight:400; padding:9px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#fff; cursor:pointer; margin:10px 8px 0 0; }
  .bt.cheio { background:#fff; color:#000; border-color:#fff; font-weight:500; }
  .modelo { display:none; margin-top:12px; border-radius:12px; padding:11px 13px; font-size:15px; background:rgba(255,255,255,.06); }
  .modelo strong { color:#fff; font-weight:500; }
  .modelo small { display:block; color:var(--fog); margin-top:3px; }
  .q.visto .modelo { display:block; }
  .conta { font-size:12.5px; color:var(--fog); margin-top:6px; }
  .conta.ok { color:var(--ok); } .conta.mais { color:var(--no); }
  .ir { display:flex; width:100%; margin:28px 0 0; padding:16px; font-size:16px; }
  .fim { position:relative; overflow:hidden; text-align:center; margin-top:30px; padding:30px 20px 24px; border-radius:22px; border:1px solid rgba(255,255,255,.14);
         background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.12), rgba(255,255,255,.02) 60%); }
  .fim .rot { font-weight:300; font-size:15px; color:var(--fog); }
  .fim .num { font-weight:200; font-size:64px; line-height:1.1; letter-spacing:-.03em; background:linear-gradient(100deg,#fff 40%,#7d7d84); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .fim .sub { margin:4px 0 0; color:#c3c3c9; }
  .zap { display:flex; width:100%; margin-top:20px; padding:15px; font-size:15.5px; }
  .zap svg { width:20px; height:20px; }
  .refazer { margin-top:14px; font-size:12.5px; color:#77777f; background:none; border:0; text-decoration:underline; cursor:pointer; }

  /* watch */
  .video { position:relative; margin:18px 0 0; aspect-ratio:16/9; border-radius:18px; overflow:hidden; background:#111; border:1px solid var(--line); box-shadow:0 30px 60px -30px rgba(255,255,255,.12); }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .vinfo { margin:14px 2px 0; }
  .vinfo b { display:block; font-weight:300; font-size:24px; line-height:1.2; letter-spacing:-.015em; color:#fff; }
  .vinfo span { display:block; margin-top:4px; color:var(--fog); font-size:13.5px; }
  .porque { margin-top:16px; font-size:14.5px; font-weight:300; color:#d0d0d6; }
  .porque strong { font-weight:500; color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--surf); border-radius:12px; padding:7px 12px; font-size:14px; font-weight:300; color:#d0d0d6; }
  .chip b { color:#fff; font-weight:500; margin-right:6px; }
  .formulas { margin:10px 0 12px; padding:0; list-style:none; display:grid; gap:6px; }
  .formulas li { border:1px solid var(--line); border-radius:10px; padding:8px 11px; font-size:14.5px; color:#fff; }

  /* tool */
  .site { display:block; text-decoration:none; color:inherit; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:var(--surf); }
  .site .bar { display:flex; align-items:center; gap:6px; padding:9px 12px; border-bottom:1px solid var(--line); }
  .site .bar i { width:9px; height:9px; border-radius:50%; background:#3a3a40; }
  .site .bar span { margin-left:8px; flex:1; background:rgba(255,255,255,.06); border-radius:8px; padding:3px 10px; font-size:12px; color:var(--fog); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .site .shot { aspect-ratio:16/10; background:#fff center/cover no-repeat; display:grid; place-items:center; color:#000; font-size:22px; }
  .site .rod { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; }
  .site .rod b { font-weight:300; font-size:22px; color:#fff; }
  .site .rod .vidro { padding:9px 16px; font-size:14px; border-radius:12px; }
  .passos { list-style:none; margin:0; padding:0; counter-reset:p; }
  .passos li { counter-increment:p; position:relative; padding:2px 0 12px 40px; font-size:15px; font-weight:300; color:#dcdce1; }
  .passos li::before { content:counter(p); position:absolute; left:0; top:-2px; font-weight:200; font-size:24px; line-height:1; color:#fff; }
  .missao { margin-top:12px; border-radius:18px; padding:18px; font-size:15px; font-weight:300; color:#e6e6ea; border:1px solid rgba(255,255,255,.16);
            background:radial-gradient(130% 120% at 0% 0%, rgba(255,255,255,.12), rgba(255,255,255,.02) 60%); }
  .missao strong { display:block; font-weight:300; font-size:22px; color:#fff; margin-bottom:6px; }

  .tranca { margin:18px 0; text-align:left; }
  .tranca input { width:100%; margin-top:12px; font:300 17px var(--f); color:#fff; padding:12px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.4); }
  footer { color:#5d5d64; font-size:12px; text-align:center; margin-top:40px; }
  footer a { color:#8a8a92; }
  @media (min-width:700px) { .hero { padding-top:26px; } .pilha { margin-top:44px; } }
  @media print { body * { display:none !important; } body::after { content:"Material exclusivo dos alunos do Teacher Walden. A impressão está desativada."; display:block; padding:40px; font:16px Arial; color:#000; } }
</style>
</head>
<body>
<div class="wrap">

      return;
    }
    if (b.id === "verModelo") { $("modeloT").style.display = "block"; b.style.display = "none"; return; }
    if (b.classList.contains("ver")) { b.closest(".item").classList.add("aberto"); return; }
    if (b.classList.contains("ouvir")) { falar(D.itens[+b.getAttribute("data-fala")].t); return; }
    if (b.id === "refazer") { if (confirm("Apagar todas as respostas desta tarefa?")) { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ":minha"); } catch (e) {} location.reload(); } return; }
    var el = b.closest(".q"); if (!el) return;
    var i = +el.getAttribute("data-q"), q = Q[i];
    if (b.classList.contains("op")) {
      if (el.classList.contains("feita")) return;
      var v = b.getAttribute("data-v");
      R[i] = { v: v, ok: v === q.certa }; grava(); pinta(el, R[i]); placar(); return;
    }
    if (b.classList.contains("peca")) {
      if (el.classList.contains("feita")) return;
      (b.parentNode.classList.contains("pecas") ? el.querySelector(".resp") : el.querySelector(".pecas")).appendChild(b); return;
    }
    var acao = b.getAttribute("data-acao");
    if (acao === "conferir") {
      var dita = Array.prototype.map.call(el.querySelectorAll(".resp .peca"), function (x) { return x.textContent; }).join(" ");
      if (!dita) return;
      R[i] = { v: dita, ok: norm(dita) === norm(q.certa) }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "modelo") {
      var escrito = el.querySelector("textarea").value, igual = escrito && norm(escrito) === norm(q.certa);
      R[i] = { v: escrito, ok: igual ? true : null }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "pronto") {
      var resposta = el.querySelector("textarea").value.trim(), np = (resposta.match(/\S+/g) || []).length;
      if (np < 10) { var ct = el.querySelector(".conta"); ct.className = "conta mais"; ct.textContent = np + (np === 1 ? " word" : " words") + ". Escreva pelo menos 10."; return; }
      R[i] = { v: resposta, ok: true }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "sim" || acao === "nao") {
      R[i] = { v: el.querySelector("textarea").value, ok: acao === "sim" }; grava(); pinta(el, R[i]); placar();
    }
  });
})();
</script>
</body>
</html>
