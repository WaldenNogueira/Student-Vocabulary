  .kick { position:relative; z-index:2; margin:30px 0 0; max-width:46%; min-height:112px; font-weight:600; font-size:15px; line-height:1.18; letter-spacing:.02em; text-transform:uppercase; color:var(--ink); text-wrap:balance; }
  h1 { position:relative; z-index:2; margin:0; font:400 clamp(54px,16.5vw,96px)/1.36 var(--s); letter-spacing:-.012em; color:var(--ink); }
  h1 span { background:var(--y); padding:0 .13em .04em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  h1 em { font-style:italic; }
  .hook { position:relative; z-index:2; margin:22px 0 0; max-width:30ch; font-weight:400; font-size:17px; line-height:1.4; color:var(--ink); }
  .pilha { position:relative; z-index:2; width:min(74%,400px); aspect-ratio:4/3; margin:34px 0 0 6px; transform:rotate(-2.5deg); }
  .pilha i { position:absolute; inset:0; }
  .pilha i:nth-child(1) { background:var(--y); transform:translate(13px,13px); }
  .pilha i:nth-child(2) { display:none; }
  .pilha .folha { position:absolute; inset:0; overflow:hidden; border:2px solid var(--ink); background:#ddd center/cover no-repeat; filter:grayscale(1) contrast(1.12); }
  .vidro { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:10px; border:0; border-radius:0; background:var(--y); color:var(--ink);
           font-weight:700; letter-spacing:.03em; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:transform .08s, background .15s; }
  .vidro:hover { background:var(--y2); } .vidro:active { transform:translate(1px,1px); }
  .comecar { z-index:2; margin-top:34px; padding:14px 22px 13px; font-size:19px; line-height:1.05; flex-direction:column; align-items:flex-start; gap:3px; min-width:0; }
  .comecar small { font-size:12.5px; font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--ink); opacity:.75; }
  .dono { position:relative; z-index:2; margin:14px 0 0; font-size:12px; color:var(--fog); }

  /* esta semana: o video e o site logo no comeco */
  .semana { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 24px; }
  .mini { display:flex; flex-direction:column; text-align:left; padding:0; border:1.5px solid var(--line); border-radius:0; overflow:hidden; background:var(--card); color:var(--ink); cursor:pointer; }
  .mini .th { position:relative; aspect-ratio:16/9; background:#ddd center/cover no-repeat; border-bottom:1.5px solid var(--line); filter:grayscale(1) contrast(1.08); }
  .mini .th.site { background-position:center; background-color:#fff; filter:none; }
  .mini .th em { position:absolute; right:0; bottom:0; font-style:normal; font-size:11px; font-weight:600; color:var(--ink); background:var(--y); padding:2px 8px; }
  .mini .th .pl { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; display:grid; place-items:center; background:var(--ink); }
  .mini .th .pl svg { width:14px; height:14px; margin-left:2px; }
  .mini b { display:block; padding:9px 11px 0; font:400 19px/1.12 var(--s); }
  .mini small { display:block; padding:3px 11px 11px; color:var(--fog); font-size:12px; font-weight:400; }

  /* abas */
  .tabs { position:sticky; top:8px; z-index:6; display:grid; grid-template-columns:repeat(4,1fr); gap:0; padding:0; border:1.5px solid var(--line); background:var(--paper); }
  .tab { display:flex; flex-direction:column; align-items:center; gap:1px; padding:8px 2px 7px; border:0; border-left:1.5px solid var(--line); border-radius:0; background:transparent; color:var(--ink); font-size:12.5px; font-weight:500; cursor:pointer; }
  .tab:first-child { border-left:0; }
  .tab svg { width:20px; height:20px; stroke-width:1.6; }
  .tab.on { background:var(--y); font-weight:700; }
  .tab .pin { font-size:10.5px; font-weight:400; color:var(--fog); min-height:14px; }
  .tab.on .pin { color:var(--ink); }
  .pg { display:none; } .pg.on { display:block; animation:entra .3s ease; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } }
  @media (prefers-reduced-motion:reduce) { .pg { animation:none !important; } }

  h2 { display:flex; align-items:baseline; gap:10px; font:400 34px/1.1 var(--s); color:var(--ink); margin:40px 0 8px; }
  h2 .nb { font:italic 400 30px/1 var(--s); background:var(--y); padding:1px 9px 3px; min-width:1.2em; text-align:center; }
  h2 .qt { margin-left:auto; font:500 12px var(--f); letter-spacing:.04em; text-transform:uppercase; color:var(--fog); white-space:nowrap; }
  .sub { color:var(--fog); font-size:14px; font-weight:400; margin:0 0 14px; }
  .card { background:var(--card); border:1.5px solid var(--line); border-radius:0; padding:16px; margin:0 0 12px; }

  /* review */
  .item .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .term { font:400 28px/1.1 var(--s); color:var(--ink); }
  .ipa { color:var(--fog); font-size:13px; font-weight:300; }
  .ouvir { margin-left:auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); display:grid; place-items:center; cursor:pointer; }
  .ouvir:hover { background:var(--y); }
  .ouvir svg { width:16px; height:16px; }
  .ex { margin:8px 0 0; color:var(--ink); font-weight:300; font-size:16px; }
  .ex b { font-weight:600; background:var(--y); padding:0 4px; }
  .ver { margin-top:10px; font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--ink); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px; }
  .pt { display:none; margin-top:12px; padding:11px 13px; background:var(--paper); border-left:4px solid var(--y); font-size:14.5px; color:var(--ink); font-weight:300; }
  .item.aberto .pt { display:block; } .item.aberto .ver { display:none; }
  .pt strong { display:block; margin-bottom:3px; font-weight:600; }
  .meus ul { margin:6px 0 0 18px; padding:0; } .meus li { margin:0 0 5px; }

  /* practice */
  .placar { position:sticky; top:var(--abas,76px); z-index:5; display:flex; align-items:center; gap:12px; padding:8px 14px; margin:16px 0 0; font-size:12.5px; font-weight:500; color:var(--ink);
            border:1.5px solid var(--line); border-top:0; background:var(--paper); }
  .barra { flex:1; height:6px; background:var(--soft); overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:var(--ink); transition:width .4s; }
  .q { background:var(--card); border:1.5px solid var(--line); border-radius:0; padding:16px; margin:0 0 12px; }
  .q .n { font:italic 400 17px var(--s); color:var(--fog); margin:0; }
  .q p { margin:4px 0 14px; font-size:17px; font-weight:400; color:var(--ink); line-height:1.5; }
  .gap { display:inline-block; min-width:76px; border-bottom:2px solid var(--ink); text-align:center; font-weight:600; padding:0 4px; }
  .ops { display:flex; flex-wrap:wrap; gap:8px; }
  .op { font-size:15px; font-weight:400; padding:10px 15px; border-radius:0; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; text-align:left; transition:background .15s, transform .08s; }
  .op:hover { background:var(--y2); }
  .op:active { transform:translate(1px,1px); }
  .op.larga { width:100%; }
  .q .op.certa { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600; }
  .q .op.errada { background:var(--no-bg); border-color:var(--no); color:var(--no); }
  .q.feita .op { cursor:default; }
  .q.feita .op:not(.certa):not(.errada) { opacity:.45; background:var(--paper); }
  .exp { display:none; margin-top:12px; font-size:14px; color:var(--ink); font-weight:300; border-left:4px solid var(--y); padding:2px 0 2px 12px; }
  .exp strong { font-weight:600; }
  .q.feita .exp { display:block; }
  .pecas, .resp { display:flex; flex-wrap:wrap; gap:6px; min-height:46px; }
  .resp { border:1.5px dashed var(--line); padding:8px; margin-bottom:8px; background:var(--paper); }
  .peca { font-size:15px; padding:7px 12px; border-radius:0; border:1.5px solid var(--line); background:var(--y); color:var(--ink); cursor:pointer; }
  .pecas .peca { background:var(--paper); }
  textarea { width:100%; min-height:78px; font:300 16px/1.5 var(--f); color:var(--ink); border:1.5px solid var(--line); border-radius:0; padding:11px 13px; resize:vertical; background:var(--paper); }
  textarea::placeholder { color:#9A927F; }
  .bt { font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:10px 16px; border-radius:0; border:1.5px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; margin:10px 8px 0 0; }
  .bt:hover { background:var(--y2); }
  .bt.cheio { background:var(--ink); color:var(--paper); }
  .bt.cheio:hover { background:#000; }
  .modelo { display:none; margin-top:12px; padding:11px 13px; font-size:15px; background:var(--paper); border-left:4px solid var(--y); }
  .modelo strong { font-weight:600; }
  .modelo small { display:block; color:var(--fog); margin-top:3px; }
  .q.visto .modelo { display:block; }
  .conta { font-size:12.5px; color:var(--fog); margin-top:6px; }
  .conta.ok { color:var(--ok); } .conta.mais { color:var(--no); }
  .ir { display:flex; width:100%; margin:28px 0 0; padding:17px; font-size:16px; }
  .fim { position:relative; overflow:hidden; text-align:center; margin-top:30px; padding:30px 20px 24px; border:2px solid var(--line); background:var(--y); }
  .fim .rot { font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); }
  .fim .num { font:400 92px/1 var(--s); letter-spacing:-.02em; color:var(--ink); }
  .fim .sub { margin:6px 0 0; color:var(--ink); }
  .zap { display:flex; width:100%; margin-top:20px; padding:16px; font-size:15px; background:var(--ink); color:var(--paper); }
  .zap:hover { background:#000; }
  .zap svg { width:20px; height:20px; }
  .refazer { margin-top:14px; font-size:12.5px; color:var(--ink); background:none; border:0; text-decoration:underline; cursor:pointer; }

  /* watch */
  .video { position:relative; margin:18px 12px 12px 0; aspect-ratio:16/9; overflow:visible; background:#111; border:2px solid var(--line); box-shadow:12px 12px 0 var(--y); }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .vinfo { margin:26px 0 0; }
  .vinfo b { display:block; font:400 34px/1.08 var(--s); color:var(--ink); }
  .vinfo span { display:block; margin-top:6px; color:var(--fog); font-size:13.5px; font-weight:400; }
  .porque { margin-top:16px; font-size:15px; font-weight:300; color:var(--ink); }
  .porque strong { font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.5px solid var(--line); background:var(--card); padding:7px 12px; font-size:14px; font-weight:300; color:var(--ink); }
  .chip b { font-weight:600; margin-right:6px; background:var(--y); padding:0 4px; }
  .formulas { margin:10px 0 12px; padding:0; list-style:none; display:grid; gap:6px; }
  .formulas li { border:1.5px solid var(--line); background:var(--paper); padding:8px 11px; font-size:14.5px; color:var(--ink); }

  /* tool */
  .site { display:block; text-decoration:none; color:inherit; overflow:hidden; border:2px solid var(--line); background:var(--card); }
  .site .bar { display:flex; align-items:center; gap:6px; padding:9px 12px; border-bottom:1.5px solid var(--line); background:var(--paper); }
  .site .bar i { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line); background:var(--y); }
  .site .bar span { margin-left:8px; flex:1; border:1.2px solid var(--line); padding:2px 10px; font-size:12px; color:var(--fog); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#fff; }
  .site .shot { aspect-ratio:16/10; background:#fff center/cover no-repeat; display:grid; place-items:center; color:#000; font-size:22px; border-bottom:1.5px solid var(--line); }
  .site .rod { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; }
  .site .rod b { font:400 28px/1.05 var(--s); color:var(--ink); }
  .site .rod .vidro { padding:10px 16px; font-size:13px; }
  .passos { list-style:none; margin:0; padding:0; counter-reset:p; }
  .passos li { counter-increment:p; position:relative; padding:4px 0 14px 46px; font-size:15px; font-weight:300; color:var(--ink); }
  .passos li::before { content:counter(p); position:absolute; left:0; top:0; width:32px; height:32px; display:grid; place-items:center; font:italic 400 24px/1 var(--s); background:var(--y); color:var(--ink); }
  .missao { margin-top:12px; padding:18px; font-size:15px; font-weight:400; color:var(--ink); border:2px solid var(--line); background:var(--y); }
  .missao strong { display:block; font:400 30px/1.05 var(--s); margin-bottom:8px; }

  .tranca { margin:18px 0; text-align:left; }
  .tranca input { width:100%; margin-top:12px; font:300 17px var(--f); color:var(--ink); padding:12px; border:1.5px solid var(--line); border-radius:0; background:var(--paper); }
  footer { position:relative; color:var(--fog); font-size:12px; text-align:center; margin-top:54px; padding-top:86px; }
  footer::before { content:""; position:absolute; left:50%; top:0; width:104px; height:78px; margin-left:-52px; background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 150%22 fill=%22none%22 stroke=%22%23141414%22 stroke-width=%221.9%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cfilter id=%22m%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.04%22 numOctaves=%222%22 seed=%229%22/%3E%3CfeDisplacementMap in=%22SourceGraphic%22 scale=%222.6%22/%3E%3C/filter%3E%3Cg filter=%22url(%23m)%22%3E%3Cpath d=%22M100 44 C76 26 40 24 10 34 V118 C40 108 76 110 100 126 Z%22 fill=%22%23FDF8EC%22/%3E%3Cpath d=%22M100 44 C124 26 160 24 190 34 V118 C160 108 124 110 100 126 Z%22 fill=%22%23FDF8EC%22/%3E%3Cpath d=%22M10 118 C40 116 76 118 100 134 C124 118 160 116 190 118%22 /%3E%3Cpath d=%22M100 44 V126%22/%3E%3Cpath d=%22M22 50 C44 43 70 45 90 54%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 54 C130 45 156 43 178 50%22 stroke-width=%221%22/%3E%3Cpath d=%22M22 61 C44 54 70 56 90 65%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 65 C130 56 156 54 178 61%22 stroke-width=%221%22/%3E%3Cpath d=%22M22 72 C44 65 70 67 90 76%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 76 C130 67 156 65 178 72%22 stroke-width=%221%22/%3E%3Cpath d=%22M22 83 C44 76 70 78 90 87%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 87 C130 78 156 76 178 83%22 stroke-width=%221%22/%3E%3Cpath d=%22M22 94 C44 87 70 89 90 98%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 98 C130 89 156 87 178 94%22 stroke-width=%221%22/%3E%3Cpath d=%22M22 105 C44 98 70 100 90 109%22 stroke-width=%221%22/%3E%3Cpath d=%22M110 109 C130 100 156 98 178 105%22 stroke-width=%221%22/%3E%3C/g%3E%3C/svg%3E") no-repeat center/contain; }
  footer a { color:var(--ink); font-weight:600; }

  .wrap:has(.tranca) .s3 { display:none; }

    if (b.classList.contains("ver")) { b.closest(".item").classList.add("aberto"); return; }
    if (b.classList.contains("ouvir")) { falar(D.itens[+b.getAttribute("data-fala")].t); return; }
    if (b.id === "refazer") { if (confirm("Apagar todas as respostas desta tarefa?")) { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ":minha"); } catch (e) {} location.reload(); } return; }
    var el = b.closest(".q"); if (!el) return;
    var i = +el.getAttribute("data-q"), q = Q[i];
    if (b.classList.contains("op")) {
      if (el.classList.contains("feita")) return;
      var v = b.getAttribute("data-v");
      R[i] = { v: v, ok: v === q.certa }; grava(); pinta(el, R[i]); placar(); return;
    }
    if (b.classList.contains("peca")) {
      if (el.classList.contains("feita")) return;
      (b.parentNode.classList.contains("pecas") ? el.querySelector(".resp") : el.querySelector(".pecas")).appendChild(b); return;
    }
    var acao = b.getAttribute("data-acao");
    if (acao === "conferir") {
      var dita = Array.prototype.map.call(el.querySelectorAll(".resp .peca"), function (x) { return x.textContent; }).join(" ");
      if (!dita) return;
      R[i] = { v: dita, ok: norm(dita) === norm(q.certa) }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "modelo") {
      var escrito = el.querySelector("textarea").value, igual = escrito && norm(escrito) === norm(q.certa);
      R[i] = { v: escrito, ok: igual ? true : null }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "pronto") {
      var resposta = el.querySelector("textarea").value.trim(), np = (resposta.match(/\S+/g) || []).length;
      if (np < 10) { var ct = el.querySelector(".conta"); ct.className = "conta mais"; ct.textContent = np + (np === 1 ? " word" : " words") + ". Escreva pelo menos 10."; return; }
      R[i] = { v: resposta, ok: true }; grava(); pinta(el, R[i]); placar();
    } else if (acao === "sim" || acao === "nao") {
      R[i] = { v: el.querySelector("textarea").value, ok: acao === "sim" }; grava(); pinta(el, R[i]); placar();
    }
  });
})();
</script>
</body>
</html>
