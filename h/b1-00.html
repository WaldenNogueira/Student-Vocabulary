<script>(function () {
  var h = location.hash.slice(1), d = "../tarefa/b1_aula00_speak_with_confidence_demo.html";
  try {
    if (/^[A-Za-z0-9_-]{16}$/.test(h)) {
      var b = atob(h.replace(/-/g, "+").replace(/_/g, "/")), x = "";
      for (var i = 0; i < b.length; i++) x += ("0" + b.charCodeAt(i).toString(16)).slice(-2);
      d += "#k=" + x.slice(0, 8) + "&s=" + x.slice(8);
    } else if (h) { d += "#" + h; }
  } catch (e) {}
  location.replace(d);
})();</script>
